name: Deploy SynapseOps to POC (ECS Fargate)

on:
  push:
    branches: [poc]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: synapse-ops
  ECS_CLUSTER: auth-api-poc-cluster
  ECS_SERVICE: synapse-ops-service
  TASK_FAMILY: synapse-ops-task
  CONTAINER_NAME: synapse-ops
  CLOUDWATCH_DASHBOARD_NAME: SynapseOps-ECS-POC
  ALB_DNS: synapse-ops-alb-1042958172.ap-south-1.elb.amazonaws.com
  TARGET_GROUP_ARN: arn:aws:elasticloadbalancing:ap-south-1:127214194014:targetgroup/synapse-ops-tg/d4f789c5757638a1

jobs:
  # ── Stage 1: Security Scanning ──────────────────────────────────────────
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install bandit safety

      - name: Run Bandit (Python security linter)
        run: bandit -r app/ *.py --severity-level medium --confidence-level medium -f json -o bandit-report.json || true

      - name: Display Bandit results
        if: always()
        run: |
          echo "=== Bandit Security Scan Results ==="
          cat bandit-report.json | python -m json.tool || echo "No issues found"

      - name: Run Safety (dependency vulnerability check)
        run: safety check -r requirements.txt --output json > safety-report.json || true

      - name: Check for hardcoded secrets
        run: |
          echo "=== Scanning for hardcoded secrets ==="
          if grep -rn "ghp_\|sk-\|AKIA\|password\s*=\s*['\"]" --include="*.py" .; then
            echo "::error::Hardcoded secrets detected!"
            exit 1
          fi
          echo "No hardcoded secrets found"

      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json

  # ── Stage 2: Build and Push Docker Image ────────────────────────────────
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: security-scan
    permissions:
      contents: read
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.POC_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.POC_AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.POC_AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "Image pushed: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

  # ── Stage 3: Deploy to ECS Fargate ─────────────────────────────────────
  deploy:
    name: Deploy to ECS Fargate
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.POC_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.POC_AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.POC_AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update task definition with new image
        id: update-task-def
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Read the task definition template
          TASK_DEF=$(cat ecs/task-definition.json)

          # Update image and environment variables
          TASK_DEF=$(echo "$TASK_DEF" | jq \
            --arg IMAGE "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            --arg ALB_URL "http://${{ env.ALB_DNS }}" \
            --arg BEDROCK_BACKEND "${{ vars.POC_BEDROCK_BACKEND }}" \
            --arg BEDROCK_AGENT_ID "${{ vars.POC_BEDROCK_AGENT_ID }}" \
            --arg BEDROCK_AGENT_ALIAS_ID "${{ vars.POC_BEDROCK_AGENT_ALIAS_ID }}" \
            --arg BEDROCK_AGENT_SESSION_PREFIX "${{ vars.POC_BEDROCK_AGENT_SESSION_PREFIX }}" \
            --arg TEAMS_URL "${{ secrets.TEAMS_WEBHOOK_URL }}" \
            --arg GH_TOKEN "${{ secrets.TARGET_REPO_TOKEN }}" \
            --arg GH_SECRET "${{ secrets.GITHUB_WEBHOOK_SECRET }}" \
            --arg GITHUB_REPO "${{ vars.POC_TARGET_GITHUB_REPO }}" \
            '.containerDefinitions[0].image = $IMAGE |
             .containerDefinitions[0].environment |= map(
               if .name == "APP_BASE_URL" then .value = $ALB_URL
               elif .name == "BEDROCK_BACKEND" and $BEDROCK_BACKEND != "" then .value = $BEDROCK_BACKEND
               elif .name == "BEDROCK_AGENT_ID" and $BEDROCK_AGENT_ID != "" then .value = $BEDROCK_AGENT_ID
               elif .name == "BEDROCK_AGENT_ALIAS_ID" and $BEDROCK_AGENT_ALIAS_ID != "" then .value = $BEDROCK_AGENT_ALIAS_ID
               elif .name == "BEDROCK_AGENT_SESSION_PREFIX" and $BEDROCK_AGENT_SESSION_PREFIX != "" then .value = $BEDROCK_AGENT_SESSION_PREFIX
               else . end
             ) |
             .containerDefinitions[0].environment += [
               {"name": "TEAMS_WEBHOOK_URL", "value": $TEAMS_URL},
               {"name": "GITHUB_TOKEN", "value": $GH_TOKEN},
               {"name": "GITHUB_WEBHOOK_SECRET", "value": $GH_SECRET}
             ] |
             .containerDefinitions[0].environment |= unique_by(.name)')

          echo "$TASK_DEF" > /tmp/task-def.json
          echo "Task definition updated with image: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Register task definition
        id: register-task
        run: |
          TASK_ARN=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/task-def.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "task_arn=$TASK_ARN" >> $GITHUB_OUTPUT
          echo "Registered: $TASK_ARN"

      - name: Create or update ECS service
        env:
          TASK_ARN: ${{ steps.register-task.outputs.task_arn }}
        run: |
          # Check if service exists
          SERVICE_STATUS=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --query 'services[0].status' \
            --output text 2>/dev/null || echo "MISSING")

          if [ "$SERVICE_STATUS" = "ACTIVE" ]; then
            echo "Updating existing service..."
            aws ecs update-service \
              --cluster ${{ env.ECS_CLUSTER }} \
              --service ${{ env.ECS_SERVICE }} \
              --task-definition $TASK_ARN \
              --force-new-deployment \
              --desired-count 1 \
              --deployment-configuration "deploymentCircuitBreaker={enable=true,rollback=true},maximumPercent=200,minimumHealthyPercent=0" \
              --health-check-grace-period-seconds 120
          else
            echo "Creating new service..."
            aws ecs create-service \
              --cluster ${{ env.ECS_CLUSTER }} \
              --service-name ${{ env.ECS_SERVICE }} \
              --task-definition $TASK_ARN \
              --desired-count 1 \
              --launch-type FARGATE \
              --deployment-configuration "deploymentCircuitBreaker={enable=true,rollback=true},maximumPercent=200,minimumHealthyPercent=50" \
              --network-configuration "awsvpcConfiguration={subnets=[subnet-062e1fe4cd90f980b,subnet-0f7844e42cd47ea09],securityGroups=[sg-05dd2690bc5891e23],assignPublicIp=ENABLED}" \
              --load-balancers "targetGroupArn=${{ env.TARGET_GROUP_ARN }},containerName=${{ env.CONTAINER_NAME }},containerPort=5000" \
              --health-check-grace-period-seconds 120
          fi

      - name: Inspect target group health check settings
        run: |
          echo "Inspecting target group health checks for FastAPI /health endpoint..."
          TG_TYPE=$(aws elbv2 describe-target-groups \
            --target-group-arns ${{ env.TARGET_GROUP_ARN }} \
            --query 'TargetGroups[0].TargetType' \
            --output text)
          TG_HC_PATH=$(aws elbv2 describe-target-groups \
            --target-group-arns ${{ env.TARGET_GROUP_ARN }} \
            --query 'TargetGroups[0].HealthCheckPath' \
            --output text)
          TG_HC_PORT=$(aws elbv2 describe-target-groups \
            --target-group-arns ${{ env.TARGET_GROUP_ARN }} \
            --query 'TargetGroups[0].HealthCheckPort' \
            --output text)
          TG_HC_PROTOCOL=$(aws elbv2 describe-target-groups \
            --target-group-arns ${{ env.TARGET_GROUP_ARN }} \
            --query 'TargetGroups[0].HealthCheckProtocol' \
            --output text)
          TG_MATCHER=$(aws elbv2 describe-target-groups \
            --target-group-arns ${{ env.TARGET_GROUP_ARN }} \
            --query 'TargetGroups[0].Matcher.HttpCode' \
            --output text)

          aws elbv2 describe-target-groups \
            --target-group-arns ${{ env.TARGET_GROUP_ARN }} \
            --query 'TargetGroups[0].{TargetType:TargetType,Protocol:Protocol,Port:Port,HealthCheckProtocol:HealthCheckProtocol,HealthCheckPort:HealthCheckPort,HealthCheckPath:HealthCheckPath,Matcher:Matcher.HttpCode}' \
            --output table || true

          if [ "$TG_TYPE" != "ip" ]; then
            echo "::error::Target group target type is '$TG_TYPE'. ECS Fargate with awsvpc requires target type 'ip'."
            exit 1
          fi

          if [ "$TG_HC_PATH" != "/health" ] && [ "$TG_HC_PATH" != "/" ]; then
            echo "::warning::Target group health check path is '$TG_HC_PATH'. Expected '/health' or '/' for this app."
          fi

          if [ "$TG_HC_PORT" != "traffic-port" ] && [ "$TG_HC_PORT" != "5000" ]; then
            echo "::warning::Target group health check port is '$TG_HC_PORT'. Expected 'traffic-port' or '5000'."
          fi

          if [ "$TG_HC_PROTOCOL" = "HTTP" ] && [ "$TG_HC_PATH" = "/health" ] && [ "$TG_HC_PORT" = "traffic-port" ] && [ "$TG_MATCHER" = "200" ]; then
            echo "Target group health checks already match the app requirements; skipping modify-target-group."
          else
            echo "Attempting to align target group health checks..."
            aws elbv2 modify-target-group \
              --target-group-arn ${{ env.TARGET_GROUP_ARN }} \
              --health-check-protocol HTTP \
              --health-check-port traffic-port \
              --health-check-path /health \
              --matcher HttpCode=200-399 \
              --healthy-threshold-count 2 \
              --unhealthy-threshold-count 5 \
              --health-check-interval-seconds 30 \
              --health-check-timeout-seconds 5 \
              || echo "::warning::Unable to modify target group health checks. The deploy role lacks elasticloadbalancing:ModifyTargetGroup. Update the target group manually or grant that permission."
          fi

          # Speed up old task drain to prevent long-running IN_PROGRESS rollouts.
          aws elbv2 modify-target-group-attributes \
            --target-group-arn ${{ env.TARGET_GROUP_ARN }} \
            --attributes Key=deregistration_delay.timeout_seconds,Value=30 \
            || echo "::warning::Unable to modify target group attributes. The deploy role lacks elasticloadbalancing:ModifyTargetGroupAttributes."

          echo "=== Effective target group settings ==="
          aws elbv2 describe-target-groups \
            --target-group-arns ${{ env.TARGET_GROUP_ARN }} \
            --query 'TargetGroups[0].{TargetType:TargetType,Protocol:Protocol,Port:Port,HealthCheckProtocol:HealthCheckProtocol,HealthCheckPort:HealthCheckPort,HealthCheckPath:HealthCheckPath,Matcher:Matcher.HttpCode}' \
            --output table || true

      - name: Wait for deployment to stabilize
        timeout-minutes: 15
        run: |
          echo "Waiting for ECS service to stabilize..."
          MAX_ATTEMPTS=45
          SLEEP_SECONDS=20
          WAIT_EXIT=1

          for ATTEMPT in $(seq 1 $MAX_ATTEMPTS); do
            SERVICE_JSON=$(aws ecs describe-services \
              --cluster ${{ env.ECS_CLUSTER }} \
              --services ${{ env.ECS_SERVICE }} \
              --output json)

            RUNNING=$(echo "$SERVICE_JSON" | jq -r '.services[0].runningCount // 0')
            DESIRED=$(echo "$SERVICE_JSON" | jq -r '.services[0].desiredCount // 0')
            PENDING=$(echo "$SERVICE_JSON" | jq -r '.services[0].pendingCount // 0')
            ROLLOUT_STATE=$(echo "$SERVICE_JSON" | jq -r '([.services[0].deployments[]? | select(.status=="PRIMARY") | .rolloutState][0]) // "IN_PROGRESS"')
            ROLLOUT_REASON=$(echo "$SERVICE_JSON" | jq -r '([.services[0].deployments[]? | select(.status=="PRIMARY") | .rolloutStateReason][0]) // ""')

            echo "[$ATTEMPT/$MAX_ATTEMPTS] running=$RUNNING desired=$DESIRED pending=$PENDING rollout=$ROLLOUT_STATE"
            if [ -n "$ROLLOUT_REASON" ]; then
              echo "Primary rollout reason: $ROLLOUT_REASON"
            fi

            if [ "$RUNNING" = "0" ] || [ "$PENDING" != "0" ]; then
              echo "=== Latest stopped task snapshot ==="
              STOPPED_TASK=$(aws ecs list-tasks \
                --cluster ${{ env.ECS_CLUSTER }} \
                --service-name ${{ env.ECS_SERVICE }} \
                --desired-status STOPPED \
                --output json | jq -r '.taskArns[0] // empty')
              if [ -n "$STOPPED_TASK" ] && [ "$STOPPED_TASK" != "None" ]; then
                aws ecs describe-tasks \
                  --cluster ${{ env.ECS_CLUSTER }} \
                  --tasks "$STOPPED_TASK" \
                  --query 'tasks[0].{Task:taskArn,Last:lastStatus,StopCode:stopCode,StoppedReason:stoppedReason,Containers:containers[*].{Name:name,Last:lastStatus,Exit:exitCode,Reason:reason}}' \
                  --output json || true
              else
                echo "No stopped tasks yet"
              fi

              echo "=== Latest ECS service event ==="
              aws ecs describe-services \
                --cluster ${{ env.ECS_CLUSTER }} \
                --services ${{ env.ECS_SERVICE }} \
                --query 'services[0].events[0].[createdAt,message]' \
                --output table || true

              echo "=== Current target health ==="
              aws elbv2 describe-target-health \
                --target-group-arn ${{ env.TARGET_GROUP_ARN }} \
                --query 'TargetHealthDescriptions[*].{Target:Target.Id,Port:Target.Port,State:TargetHealth.State,Reason:TargetHealth.Reason,Description:TargetHealth.Description}' \
                --output table || true
            fi

            if [ "$ROLLOUT_STATE" = "FAILED" ]; then
              echo "::error::Primary deployment failed"
              WAIT_EXIT=1
              break
            fi

            if [ "$RUNNING" = "$DESIRED" ] && [ "$PENDING" = "0" ] && [ "$ROLLOUT_STATE" = "COMPLETED" ]; then
              echo "ECS service is stable"
              WAIT_EXIT=0
              break
            fi

            if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
              sleep $SLEEP_SECONDS
            fi
          done

          echo "=== Service Status ==="
          aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --query 'services[0].{Status:status,Running:runningCount,Desired:desiredCount,Deployments:deployments[*].{Status:status,Running:runningCount,Desired:desiredCount,Rollout:rolloutState}}' \
            --output json

          if [ "$WAIT_EXIT" -ne 0 ]; then
            echo "::error::ECS service did not stabilize. Collecting diagnostics..."

            echo "=== Recent ECS Service Events ==="
            aws ecs describe-services \
              --cluster ${{ env.ECS_CLUSTER }} \
              --services ${{ env.ECS_SERVICE }} \
              --query 'services[0].events[0:20].[createdAt,message]' \
              --output table || true

            echo "=== Tasks (RUNNING + STOPPED) ==="
            TASKS=$(aws ecs list-tasks \
              --cluster ${{ env.ECS_CLUSTER }} \
              --service-name ${{ env.ECS_SERVICE }} \
              --desired-status RUNNING \
              --query 'taskArns' --output text)
            STOPPED_TASKS=$(aws ecs list-tasks \
              --cluster ${{ env.ECS_CLUSTER }} \
              --service-name ${{ env.ECS_SERVICE }} \
              --desired-status STOPPED \
              --max-items 5 \
              --query 'taskArns' --output text)

            ALL_TASKS="$TASKS $STOPPED_TASKS"
            if [ -n "$ALL_TASKS" ] && [ "$ALL_TASKS" != "None" ]; then
              aws ecs describe-tasks \
                --cluster ${{ env.ECS_CLUSTER }} \
                --tasks $ALL_TASKS \
                --query 'tasks[*].{Task:taskArn,Last:lastStatus,Desired:desiredStatus,Health:healthStatus,StopCode:stopCode,StoppedReason:stoppedReason,Containers:containers[*].{Name:name,Last:lastStatus,Exit:exitCode,Reason:reason}}' \
                --output json || true
            else
              echo "No ECS tasks found for service"
            fi

            echo "=== Target Group Health ==="
            TG_ARN=$(aws ecs describe-services \
              --cluster ${{ env.ECS_CLUSTER }} \
              --services ${{ env.ECS_SERVICE }} \
              --query 'services[0].loadBalancers[0].targetGroupArn' \
              --output text)
            if [ -n "$TG_ARN" ] && [ "$TG_ARN" != "None" ]; then
              aws elbv2 describe-target-health \
                --target-group-arn "$TG_ARN" \
                --query 'TargetHealthDescriptions[*].{Target:Target.Id,Port:Target.Port,State:TargetHealth.State,Reason:TargetHealth.Reason,Description:TargetHealth.Description}' \
                --output table || true
            else
              echo "Service has no associated target group"
            fi

            exit 1
          fi

      - name: Upsert CloudWatch dashboard
        env:
          DASHBOARD_REGION: ${{ env.AWS_REGION }}
          DASHBOARD_CLUSTER: ${{ env.ECS_CLUSTER }}
          DASHBOARD_SERVICE: ${{ env.ECS_SERVICE }}
          DASHBOARD_NAME: ${{ env.CLOUDWATCH_DASHBOARD_NAME }}
          DASHBOARD_ALB_DNS: ${{ env.ALB_DNS }}
          DASHBOARD_TARGET_GROUP_ARN: ${{ env.TARGET_GROUP_ARN }}
        run: |
          set -euo pipefail

          LOAD_BALANCER_ARN=$(aws elbv2 describe-load-balancers \
            --query "LoadBalancers[?DNSName=='$DASHBOARD_ALB_DNS'].LoadBalancerArn | [0]" \
            --output text)

          if [ -z "$LOAD_BALANCER_ARN" ] || [ "$LOAD_BALANCER_ARN" = "None" ]; then
            echo "::error::Unable to resolve ALB ARN from DNS name $DASHBOARD_ALB_DNS"
            exit 1
          fi

          export LOAD_BALANCER_DIMENSION=$(echo "$LOAD_BALANCER_ARN" | sed 's#.*loadbalancer/##')
          export TARGET_GROUP_DIMENSION=$(echo "$DASHBOARD_TARGET_GROUP_ARN" | sed 's#.*targetgroup/##')
          export MONITORED_LOG_GROUP=$(jq -r '.containerDefinitions[0].environment[] | select(.name == "CLOUDWATCH_LOG_GROUP") | .value' ecs/task-definition.json)
          export SYNAPSE_LOG_GROUP=$(jq -r '.containerDefinitions[0].logConfiguration.options["awslogs-group"]' ecs/task-definition.json)

          python - <<'PY'
import json
import os
from pathlib import Path

template_path = Path("ecs/cloudwatch-dashboard.json.tpl")
output_path = Path("/tmp/cloudwatch-dashboard.json")

replacements = {
    "__AWS_REGION__": os.environ["DASHBOARD_REGION"],
    "__ECS_CLUSTER__": os.environ["DASHBOARD_CLUSTER"],
    "__ECS_SERVICE__": os.environ["DASHBOARD_SERVICE"],
    "__LOAD_BALANCER_DIMENSION__": os.environ["LOAD_BALANCER_DIMENSION"],
    "__TARGET_GROUP_DIMENSION__": os.environ["TARGET_GROUP_DIMENSION"],
    "__MONITORED_LOG_GROUP__": os.environ["MONITORED_LOG_GROUP"],
    "__SYNAPSE_LOG_GROUP__": os.environ["SYNAPSE_LOG_GROUP"],
}

body = template_path.read_text(encoding="utf-8")
for key, value in replacements.items():
    body = body.replace(key, value)

json.loads(body)
output_path.write_text(body, encoding="utf-8")
PY

          aws cloudwatch put-dashboard \
            --region "$DASHBOARD_REGION" \
            --dashboard-name "$DASHBOARD_NAME" \
            --dashboard-body file:///tmp/cloudwatch-dashboard.json

          echo "Dashboard updated: $DASHBOARD_NAME"

  # ── Stage 4: Post-Deployment Validation ─────────────────────────────────
  post-deploy-validation:
    name: Post-Deployment Validation
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.POC_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.POC_AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.POC_AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify ECS service status
        run: |
          echo "=== ECS Service Status ==="
          aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --query 'services[0].{Status:status,Running:runningCount,Desired:desiredCount,TaskDef:taskDefinition}' \
            --output table

      - name: Verify task is running
        run: |
          echo "=== Running Tasks ==="
          TASKS=$(aws ecs list-tasks \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service-name ${{ env.ECS_SERVICE }} \
            --query 'taskArns' --output text)

          if [ -z "$TASKS" ]; then
            echo "::error::No running tasks found!"
            exit 1
          fi

          aws ecs describe-tasks \
            --cluster ${{ env.ECS_CLUSTER }} \
            --tasks $TASKS \
            --query 'tasks[*].{TaskId:taskArn,Status:lastStatus,Health:healthStatus,StartedAt:startedAt}' \
            --output table

      - name: Health check via ALB
        run: |
          echo "=== Health Check ==="
          sleep 15
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://${{ env.ALB_DNS }}/health || echo "000")
          echo "Health endpoint returned: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::warning::Health check returned $HTTP_CODE — service may still be starting"
          else
            echo "Health check passed!"
          fi

      - name: Print public URL
        run: |
          echo "============================================"
          echo "🌐 SynapseOps POC URL: http://${{ env.ALB_DNS }}"
          echo "============================================"

      - name: Check recent logs
        if: always()
        run: |
          echo "=== Recent Container Logs ==="
          TASKS=$(aws ecs list-tasks \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service-name ${{ env.ECS_SERVICE }} \
            --query 'taskArns[0]' --output text)

          if [ "$TASKS" != "None" ] && [ -n "$TASKS" ]; then
            TASK_ID=$(echo $TASKS | rev | cut -d'/' -f1 | rev)
            aws logs get-log-events \
              --log-group-name /ecs/synapse-ops \
              --log-stream-name "ecs/synapse-ops/$TASK_ID" \
              --limit 30 \
              --query 'events[*].message' \
              --output text 2>/dev/null || echo "Logs not yet available"
          fi
