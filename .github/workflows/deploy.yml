name: Deploy SynapseOps Agent

on:
  push:
    branches: [development]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: synapse-ops
  EKS_CLUSTER: auth-api-cluster
  HELM_RELEASE: synapse-ops
  HELM_NAMESPACE: default

jobs:
  # ── Stage 1: Security Scanning ──────────────────────────────────────────
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install bandit safety

      - name: Run Bandit (Python security linter)
        run: bandit -r app/ *.py --severity-level medium --confidence-level medium -f json -o bandit-report.json || true

      - name: Display Bandit results
        if: always()
        run: |
          echo "=== Bandit Security Scan Results ==="
          cat bandit-report.json | python -m json.tool || echo "No issues found"

      - name: Run Safety (dependency vulnerability check)
        run: safety check -r requirements.txt --output json > safety-report.json || true

      - name: Display Safety results
        if: always()
        run: |
          echo "=== Dependency Vulnerability Results ==="
          cat safety-report.json | python -m json.tool || echo "No vulnerabilities found"

      - name: Check for hardcoded secrets
        run: |
          echo "=== Scanning for hardcoded secrets ==="
          if grep -rn "ghp_\|sk-\|AKIA\|password\s*=\s*['\"]" --include="*.py" .; then
            echo "::error::Hardcoded secrets detected!"
            exit 1
          fi
          echo "No hardcoded secrets found"

      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json

  # ── Stage 2: Build and Push Docker Image ────────────────────────────────
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: security-scan
    permissions:
      contents: read
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "Image pushed: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

  # ── Stage 3: Deploy to EKS ─────────────────────────────────────────────
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.13.0'

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.EKS_CLUSTER }} \
            --region ${{ env.AWS_REGION }}

      - name: Clean up stuck Helm release
        run: |
          STATUS=$(helm status ${{ env.HELM_RELEASE }} -n ${{ env.HELM_NAMESPACE }} -o json 2>/dev/null | jq -r '.info.status' 2>/dev/null || echo "not-found")
          echo "Current Helm release status: $STATUS"
          if [ "$STATUS" = "pending-install" ] || [ "$STATUS" = "pending-upgrade" ] || [ "$STATUS" = "pending-rollback" ] || [ "$STATUS" = "failed" ]; then
            echo "Release is stuck in $STATUS — uninstalling..."
            helm uninstall ${{ env.HELM_RELEASE }} -n ${{ env.HELM_NAMESPACE }} --wait || true
            echo "Waiting for resources to clean up..."
            kubectl delete deployment ${{ env.HELM_RELEASE }} -n ${{ env.HELM_NAMESPACE }} --ignore-not-found=true
            sleep 10
          fi

      - name: Deploy with Helm
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          helm upgrade --install ${{ env.HELM_RELEASE }} ./helm/synapse-ops \
            --namespace ${{ env.HELM_NAMESPACE }} \
            --set image.repository=$ECR_REGISTRY/$ECR_REPOSITORY \
            --set image.tag=$IMAGE_TAG \
            --set secrets.TEAMS_WEBHOOK_URL="${{ secrets.TEAMS_WEBHOOK_URL }}" \
            --set secrets.GITHUB_TOKEN="${{ secrets.TARGET_REPO_TOKEN }}" \
            --set secrets.GITHUB_WEBHOOK_SECRET="${{ secrets.GITHUB_WEBHOOK_SECRET }}" \
            --set env.GITHUB_REPO="${{ vars.TARGET_GITHUB_REPO }}" \
            --timeout 300s --force

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/${{ env.HELM_RELEASE }} \
            --namespace ${{ env.HELM_NAMESPACE }} --timeout=180s || true

      - name: Debug pod status on failure
        if: always()
        run: |
          echo "=== Pod Status ==="
          kubectl get pods -l app=${{ env.HELM_RELEASE }} -n ${{ env.HELM_NAMESPACE }} -o wide
          echo ""
          echo "=== Pod Describe ==="
          kubectl describe pods -l app=${{ env.HELM_RELEASE }} -n ${{ env.HELM_NAMESPACE }}
          echo ""
          echo "=== Pod Logs ==="
          kubectl logs -l app=${{ env.HELM_RELEASE }} -n ${{ env.HELM_NAMESPACE }} --tail=80 || true
          echo ""
          echo "=== Previous Pod Logs (if crashed) ==="
          kubectl logs -l app=${{ env.HELM_RELEASE }} -n ${{ env.HELM_NAMESPACE }} --previous --tail=50 || true
          echo ""
          echo "=== Events ==="
          kubectl get events -n ${{ env.HELM_NAMESPACE }} --sort-by='.lastTimestamp' | tail -20

      - name: Verify rollout succeeded
        run: |
          READY=$(kubectl get deployment ${{ env.HELM_RELEASE }} -n ${{ env.HELM_NAMESPACE }} -o jsonpath='{.status.readyReplicas}' 2>/dev/null || echo "0")
          if [ "$READY" != "1" ]; then
            echo "::error::Deployment not ready. Ready replicas: $READY"
            exit 1
          fi
          echo "Deployment is ready with $READY replica(s)"

  # ── Stage 4: Post-Deployment Validation ─────────────────────────────────
  post-deploy-validation:
    name: Post-Deployment Validation
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.EKS_CLUSTER }} \
            --region ${{ env.AWS_REGION }}

      - name: Verify pod status
        run: |
          echo "=== Pod Status ==="
          kubectl get pods -l app=${{ env.HELM_RELEASE }} \
            --namespace ${{ env.HELM_NAMESPACE }} -o wide
          
          echo ""
          echo "=== Checking all pods are Running ==="
          READY=$(kubectl get pods -l app=${{ env.HELM_RELEASE }} \
            --namespace ${{ env.HELM_NAMESPACE }} \
            -o jsonpath='{.items[*].status.phase}')
          
          if [ "$READY" != "Running" ]; then
            echo "::error::Pod is not in Running state: $READY"
            kubectl logs -l app=${{ env.HELM_RELEASE }} \
              --namespace ${{ env.HELM_NAMESPACE }} --tail=50
            exit 1
          fi
          echo "All pods are Running"

      - name: Health check
        run: |
          echo "=== Health Check ==="
          POD_NAME=$(kubectl get pods -l app=${{ env.HELM_RELEASE }} \
            --namespace ${{ env.HELM_NAMESPACE }} \
            -o jsonpath='{.items[0].metadata.name}')
          
          HEALTH=$(kubectl exec $POD_NAME \
            --namespace ${{ env.HELM_NAMESPACE }} \
            -- python -c "import urllib.request; print(urllib.request.urlopen('http://localhost:5000/health').read().decode())")
          echo "Health: $HEALTH"
          
          READY=$(kubectl exec $POD_NAME \
            --namespace ${{ env.HELM_NAMESPACE }} \
            -- python -c "import urllib.request; print(urllib.request.urlopen('http://localhost:5000/health/ready').read().decode())")
          echo "Readiness: $READY"

      - name: Verify service endpoints
        run: |
          echo "=== Service Endpoints ==="
          kubectl get svc ${{ env.HELM_RELEASE }} \
            --namespace ${{ env.HELM_NAMESPACE }} -o wide
          
          kubectl get endpoints ${{ env.HELM_RELEASE }} \
            --namespace ${{ env.HELM_NAMESPACE }}

      - name: Check recent logs
        if: always()
        run: |
          echo "=== Recent Pod Logs (last 30 lines) ==="
          kubectl logs -l app=${{ env.HELM_RELEASE }} \
            --namespace ${{ env.HELM_NAMESPACE }} --tail=30
