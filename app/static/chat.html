<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat — SynapseOps</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: #161b22;
            border-bottom: 1px solid #30363d;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .title { font-size: 18px; font-weight: 600; }
        .accent { color: #58a6ff; }
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 24px;
            overflow: hidden;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .message {
            padding: 12px 16px;
            border-radius: 8px;
            max-width: 80%;
            word-wrap: break-word;
        }
        .message.user {
            background: #1f6feb;
            color: white;
            align-self: flex-end;
            margin-left: auto;
        }
        .message.assistant {
            background: #21262d;
            border: 1px solid #30363d;
            align-self: flex-start;
        }
        .message.system {
            background: rgba(187, 128, 9, 0.1);
            border: 1px solid rgba(187, 128, 9, 0.3);
            color: #e3b341;
            align-self: center;
            font-size: 13px;
            max-width: 100%;
            text-align: center;
        }
        .input-area {
            display: flex;
            gap: 12px;
            background: #161b22;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid #30363d;
        }
        .input-area input {
            flex: 1;
            background: #0d1117;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }
        .input-area input:focus {
            border-color: #58a6ff;
        }
        .input-area button {
            background: #238636;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .input-area button:hover {
            background: #2ea043;
        }
        .input-area button:disabled {
            background: #21262d;
            color: #6e7681;
            cursor: not-allowed;
        }
        .typing {
            color: #6e7681;
            font-style: italic;
            font-size: 13px;
            padding: 8px 16px;
        }
        .empty-state {
            text-align: center;
            color: #6e7681;
            padding: 40px 20px;
        }
        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">💬 <span class="accent">Chat</span> with SynapseOps</div>
        <a href="/" style="color: #58a6ff; text-decoration: none; font-size: 14px;">← Back to Dashboard</a>
    </div>
    
    <div class="chat-container">
        <div class="messages" id="messages">
            <div class="empty-state">
                <div class="icon">🤖</div>
                <p>Ask me about your deployments, errors, or system health</p>
                <p style="margin-top: 8px; font-size: 13px;">Try: "Show me recent errors" or "What's the status of my APIs?"</p>
            </div>
        </div>
        
        <div class="input-area">
            <input 
                type="text" 
                id="messageInput" 
                placeholder="Ask about deployments, errors, metrics..." 
                autocomplete="off"
            />
            <button id="sendBtn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const messagesDiv = document.getElementById('messages');
        const input = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        let conversationHistory = [];

        // Remove empty state when first message is sent
        function removeEmptyState() {
            const emptyState = document.querySelector('.empty-state');
            if (emptyState) emptyState.remove();
        }

        function addMessage(role, content) {
            removeEmptyState();
            
            const msg = document.createElement('div');
            msg.className = `message ${role}`;
            msg.textContent = content;
            messagesDiv.appendChild(msg);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            
            conversationHistory.push({ role, content });
        }

        function showTyping() {
            removeEmptyState();
            const typing = document.createElement('div');
            typing.className = 'typing';
            typing.id = 'typing';
            typing.textContent = 'SynapseOps is thinking...';
            messagesDiv.appendChild(typing);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function hideTyping() {
            const typing = document.getElementById('typing');
            if (typing) typing.remove();
        }

        async function sendMessage() {
            const message = input.value.trim();
            if (!message) return;

            // Add user message
            addMessage('user', message);
            input.value = '';
            sendBtn.disabled = true;
            showTyping();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: message,
                        history: conversationHistory.slice(-10) // Last 10 messages for context
                    })
                });

                hideTyping();

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();
                addMessage('assistant', data.response || 'Sorry, I couldn\'t process that request.');

            } catch (error) {
                hideTyping();
                addMessage('system', `Error: ${error.message}. Please try again.`);
            } finally {
                sendBtn.disabled = false;
                input.focus();
            }
        }

        // Enter key to send
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !sendBtn.disabled) {
                sendMessage();
            }
        });

        // Focus input on load
        input.focus();
    </script>
</body>
</html>
