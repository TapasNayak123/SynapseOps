<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SynapseOps{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #060a13;
            color: #c9d1d9;
            min-height: 100vh;
            overflow-x: hidden;
        }
        a { color: #7eb8ff; text-decoration: none; transition: color 0.2s; }
        a:hover { color: #a5d0ff; }

        body::before {
            content: '';
            position: fixed; top: -200px; right: -200px;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(88,166,255,0.06) 0%, transparent 70%);
            border-radius: 50%; pointer-events: none; z-index: 0;
        }
        body::after {
            content: '';
            position: fixed; bottom: -200px; left: -100px;
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(167,139,250,0.05) 0%, transparent 70%);
            border-radius: 50%; pointer-events: none; z-index: 0;
        }

        /* ── Nav ── */
        .nav {
            background: rgba(12,17,28,0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(88,166,255,0.08);
            padding: 0 32px;
            display: flex; align-items: center; gap: 4px; height: 64px;
            position: sticky; top: 0; z-index: 100;
        }
        .nav-logo {
            font-size: 20px; font-weight: 900; color: #f0f6fc;
            margin-right: 32px; letter-spacing: -0.5px;
            display: flex; align-items: center; gap: 10px;
        }
        .nav-logo-icon {
            width: 36px; height: 36px;
            background: linear-gradient(135deg, #58a6ff, #a78bfa);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
            box-shadow: 0 4px 15px rgba(88,166,255,0.25);
        }
        .nav-logo-text {
            background: linear-gradient(135deg, #f0f6fc 0%, #a5d0ff 100%);
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .nav-link {
            color: #6e7681; font-size: 13px; font-weight: 600;
            padding: 8px 16px; border-radius: 10px;
            transition: all 0.25s; position: relative;
        }
        .nav-link:hover { color: #c9d1d9; background: rgba(255,255,255,0.04); }
        .nav-link.active {
            color: #f0f6fc;
            background: rgba(88,166,255,0.1);
            box-shadow: inset 0 0 0 1px rgba(88,166,255,0.15);
        }
        .nav-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
        .nav-status {
            display: flex; align-items: center; gap: 6px;
            font-size: 11px; font-weight: 600; color: #3fb950;
            background: rgba(63,185,80,0.08);
            padding: 5px 12px; border-radius: 20px;
            border: 1px solid rgba(63,185,80,0.15);
        }
        .nav-status-dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: #3fb950;
            box-shadow: 0 0 8px rgba(63,185,80,0.6);
            animation: statusPulse 2s ease-in-out infinite;
        }
        @keyframes statusPulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 8px rgba(63,185,80,0.6); }
            50% { opacity: 0.5; box-shadow: 0 0 4px rgba(63,185,80,0.3); }
        }

        /* ── Layout ── */
        .container { max-width: 1320px; margin: 0 auto; padding: 32px 28px 120px; position: relative; z-index: 1; }

        /* ── Page title ── */
        .page-title {
            font-size: 26px; font-weight: 900; color: #f0f6fc;
            margin-bottom: 28px; letter-spacing: -0.5px;
            display: flex; align-items: center; gap: 12px;
        }
        .page-title .accent {
            background: linear-gradient(135deg, #58a6ff, #a78bfa);
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* ── Stat cards ── */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 14px; margin-bottom: 28px;
        }
        .stat-card {
            background: rgba(13,19,33,0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(88,166,255,0.08);
            border-radius: 16px; padding: 22px 20px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative; overflow: hidden;
        }
        .stat-card::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, rgba(88,166,255,0.3), transparent);
            opacity: 0; transition: opacity 0.3s;
        }
        .stat-card:hover {
            transform: translateY(-3px);
            border-color: rgba(88,166,255,0.2);
            box-shadow: 0 8px 30px rgba(0,0,0,0.3), 0 0 0 1px rgba(88,166,255,0.1);
        }
        .stat-card:hover::before { opacity: 1; }
        .stat-card .label { font-size: 11px; color: #6e7681; text-transform: uppercase; letter-spacing: 1.2px; font-weight: 700; }
        .stat-card .value { font-size: 34px; font-weight: 900; color: #f0f6fc; margin-top: 8px; letter-spacing: -1.5px; }
        .stat-card .sub { font-size: 12px; color: #484f58; margin-top: 4px; font-weight: 500; }

        /* ── Table ── */
        .table-wrap {
            background: rgba(13,19,33,0.7); backdrop-filter: blur(10px);
            border: 1px solid rgba(88,166,255,0.08); border-radius: 16px; overflow: hidden;
        }
        .table-header {
            padding: 18px 24px; border-bottom: 1px solid rgba(88,166,255,0.08);
            font-weight: 700; font-size: 15px; color: #f0f6fc;
            display: flex; align-items: center; gap: 8px;
        }
        table { width: 100%; border-collapse: collapse; }
        th {
            text-align: left; padding: 12px 24px; font-size: 10px; color: #484f58;
            text-transform: uppercase; letter-spacing: 1.2px; font-weight: 700;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        td { padding: 14px 24px; font-size: 13px; border-bottom: 1px solid rgba(255,255,255,0.02); }
        tr:last-child td { border-bottom: none; }
        tr { transition: background 0.2s; }
        tr:hover { background: rgba(88,166,255,0.03); }

        /* ── Badges ── */
        .badge { display: inline-block; padding: 3px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; letter-spacing: 0.3px; }
        .badge-low { background: rgba(56,139,253,0.12); color: #79c0ff; border: 1px solid rgba(56,139,253,0.15); }
        .badge-medium { background: rgba(227,179,65,0.1); color: #e3b341; border: 1px solid rgba(227,179,65,0.15); }
        .badge-high { background: rgba(248,81,73,0.1); color: #f85149; border: 1px solid rgba(248,81,73,0.15); }
        .badge-unknown { background: rgba(110,118,129,0.1); color: #8b949e; border: 1px solid rgba(110,118,129,0.15); }

        /* ── Detail page ── */
        .detail-header {
            background: rgba(13,19,33,0.7); backdrop-filter: blur(10px);
            border: 1px solid rgba(88,166,255,0.08); border-radius: 16px;
            padding: 28px; margin-bottom: 24px;
        }
        .detail-title { font-size: 22px; font-weight: 900; color: #f0f6fc; letter-spacing: -0.5px; }
        .detail-meta { font-size: 13px; color: #6e7681; margin-top: 14px; display: flex; gap: 12px; flex-wrap: wrap; }
        .detail-meta span {
            background: rgba(255,255,255,0.03); padding: 5px 12px;
            border-radius: 8px; border: 1px solid rgba(255,255,255,0.04); font-size: 12px;
        }

        /* ── Agent cards ── */
        .agent-card {
            background: rgba(13,19,33,0.7); backdrop-filter: blur(10px);
            border: 1px solid rgba(88,166,255,0.08); border-radius: 16px;
            margin-bottom: 14px; overflow: hidden; transition: border-color 0.3s;
        }
        .agent-card:hover { border-color: rgba(88,166,255,0.18); }
        .agent-card-header {
            padding: 16px 24px; border-bottom: 1px solid rgba(255,255,255,0.04);
            display: flex; justify-content: space-between; align-items: center;
        }
        .agent-card-header .name { font-weight: 700; color: #f0f6fc; font-size: 14px; }
        .agent-card-header .dur { font-size: 12px; color: #484f58; font-weight: 600; }
        .agent-card-body {
            padding: 20px 24px; font-size: 13px; line-height: 1.8;
            white-space: pre-wrap; max-height: 400px; overflow-y: auto;
        }
        .summary-box {
            background: rgba(13,19,33,0.7); border: 1px solid rgba(88,166,255,0.08);
            border-radius: 16px; padding: 24px; line-height: 1.8; white-space: pre-wrap; font-size: 13px;
        }
        .empty-state { text-align: center; padding: 80px 20px; color: #484f58; }
        .empty-state .icon { font-size: 52px; margin-bottom: 16px; opacity: 0.5; }
        .empty-state p { font-size: 14px; line-height: 1.6; }
        .back-link {
            display: inline-flex; align-items: center; gap: 6px;
            margin-bottom: 20px; font-size: 13px; color: #484f58;
            font-weight: 600; transition: color 0.2s;
        }
        .back-link:hover { color: #7eb8ff; }

        /* ── Buttons ── */
        .btn {
            display: inline-block; padding: 10px 24px; border-radius: 10px;
            font-size: 13px; font-weight: 700; cursor: pointer; border: none;
            transition: all 0.25s; font-family: 'Inter', sans-serif;
        }
        .btn-primary {
            background: linear-gradient(135deg, #238636, #2ea043); color: #fff;
            box-shadow: 0 4px 15px rgba(35,134,54,0.25);
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(35,134,54,0.35); }
        .btn-danger {
            background: linear-gradient(135deg, #da3633, #f85149); color: #fff;
            box-shadow: 0 4px 15px rgba(218,54,51,0.25);
        }
        .btn-danger:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(218,54,51,0.35); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

        /* ── Form inputs ── */
        .input {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(88,166,255,0.1);
            color: #c9d1d9; padding: 10px 14px; border-radius: 10px;
            font-size: 13px; font-family: 'Inter', sans-serif; transition: all 0.25s;
        }
        .input:focus {
            outline: none; border-color: rgba(88,166,255,0.4);
            background: rgba(255,255,255,0.05); box-shadow: 0 0 0 3px rgba(88,166,255,0.08);
        }
        .input::placeholder { color: #30363d; }

        /* ── Scrollbar ── */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #21262d; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #30363d; }

        /* ── Floating Chat Widget ── */
        .chat-fab {
            position: fixed; bottom: 28px; right: 28px;
            width: 60px; height: 60px; border-radius: 50%;
            background: linear-gradient(135deg, #58a6ff, #a78bfa);
            border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 26px; color: #fff;
            box-shadow: 0 6px 30px rgba(88,166,255,0.35), 0 0 0 0 rgba(88,166,255,0.3);
            z-index: 1000;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            animation: fabPulse 3s ease-in-out infinite;
        }
        .chat-fab:hover { transform: scale(1.08); box-shadow: 0 8px 35px rgba(88,166,255,0.45); animation: none; }
        .chat-fab.open {
            transform: rotate(90deg) scale(1); animation: none;
            background: linear-gradient(135deg, #f85149, #da3633);
            box-shadow: 0 6px 25px rgba(248,81,73,0.3);
        }
        .chat-fab.open:hover { transform: rotate(90deg) scale(1.08); }
        @keyframes fabPulse {
            0%, 100% { box-shadow: 0 6px 30px rgba(88,166,255,0.35), 0 0 0 0 rgba(88,166,255,0.2); }
            50% { box-shadow: 0 6px 30px rgba(88,166,255,0.35), 0 0 0 12px rgba(88,166,255,0); }
        }

        .chat-window {
            position: fixed; bottom: 100px; right: 28px;
            width: 480px; max-height: 480px;
            background: rgba(10,14,23,0.97);
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(88,166,255,0.12); border-radius: 20px;
            z-index: 999; display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(88,166,255,0.05);
            opacity: 0; transform: translateY(20px) scale(0.95);
            pointer-events: none;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .chat-window.open { opacity: 1; transform: translateY(0) scale(1); pointer-events: all; }

        .chat-win-header {
            padding: 18px 20px; border-bottom: 1px solid rgba(88,166,255,0.08);
            display: flex; align-items: center; gap: 12px; flex-shrink: 0;
        }
        .chat-win-header-icon {
            width: 38px; height: 38px;
            background: linear-gradient(135deg, #58a6ff, #a78bfa);
            border-radius: 10px; display: flex; align-items: center; justify-content: center;
            font-size: 18px; box-shadow: 0 4px 12px rgba(88,166,255,0.2);
        }
        .chat-win-header-text h3 { font-size: 14px; font-weight: 800; color: #f0f6fc; letter-spacing: -0.3px; }
        .chat-win-header-text p {
            font-size: 11px; color: #3fb950; font-weight: 600;
            display: flex; align-items: center; gap: 5px;
        }
        .chat-win-header-text p::before {
            content: ''; width: 6px; height: 6px; border-radius: 50%;
            background: #3fb950; display: inline-block;
        }

        .chat-win-body {
            flex: 1; overflow-y: auto; padding: 16px;
            display: flex; flex-direction: column; gap: 10px;
        }
        .chat-welcome { text-align: center; padding: 30px 16px; }
        .chat-welcome-emoji { font-size: 36px; margin-bottom: 12px; }
        .chat-welcome h4 { font-size: 15px; font-weight: 700; color: #f0f6fc; margin-bottom: 6px; }
        .chat-welcome p { font-size: 12px; color: #484f58; line-height: 1.5; }

        .chat-quick-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 4px; }
        .chat-quick-btn {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(88,166,255,0.08);
            border-radius: 10px; padding: 10px 12px; cursor: pointer;
            transition: all 0.2s; text-align: left; color: #c9d1d9;
            font-family: 'Inter', sans-serif;
        }
        .chat-quick-btn:hover {
            background: rgba(88,166,255,0.06); border-color: rgba(88,166,255,0.2);
            transform: translateY(-1px);
        }
        .chat-quick-btn .qicon { font-size: 16px; margin-bottom: 4px; }
        .chat-quick-btn .qtitle { font-size: 11px; font-weight: 700; color: #f0f6fc; }
        .chat-quick-btn .qdesc { font-size: 10px; color: #484f58; margin-top: 2px; }

        .chat-msg {
            max-width: 85%; padding: 10px 14px; border-radius: 14px;
            font-size: 13px; line-height: 1.6; white-space: pre-wrap; word-wrap: break-word;
            animation: chatFadeIn 0.3s ease;
        }
        @keyframes chatFadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .chat-msg.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #58a6ff, #a78bfa);
            color: #fff; border-bottom-right-radius: 4px;
            box-shadow: 0 3px 12px rgba(88,166,255,0.2);
        }
        .chat-msg.bot {
            align-self: flex-start;
            background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06);
            color: #c9d1d9; border-bottom-left-radius: 4px;
        }
        .chat-msg .chat-data {
            margin-top: 8px; padding: 8px 10px;
            background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.05);
            border-radius: 8px; font-size: 10px; font-family: 'Courier New', monospace;
            max-height: 150px; overflow-y: auto; color: #6e7681;
        }
        .chat-typing {
            align-self: flex-start; padding: 10px 18px;
            background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06);
            border-radius: 14px; border-bottom-left-radius: 4px;
        }
        .chat-typing span {
            display: inline-block; width: 7px; height: 7px; border-radius: 50%;
            background: #58a6ff; margin: 0 2px; animation: chatDots 1.4s infinite both;
        }
        .chat-typing span:nth-child(2) { animation-delay: 0.2s; }
        .chat-typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes chatDots {
            0%, 80%, 100% { opacity: 0.15; transform: scale(0.8); }
            40% { opacity: 1; transform: scale(1); }
        }

        .chat-win-input {
            padding: 14px 16px; border-top: 1px solid rgba(88,166,255,0.08);
            display: flex; gap: 8px; flex-shrink: 0; background: rgba(6,10,19,0.5);
        }
        .chat-win-input input {
            flex: 1; background: rgba(255,255,255,0.04);
            border: 1px solid rgba(88,166,255,0.1); border-radius: 10px;
            padding: 10px 14px; color: #c9d1d9; font-size: 13px;
            font-family: 'Inter', sans-serif; outline: none; transition: all 0.2s;
        }
        .chat-win-input input:focus { border-color: rgba(88,166,255,0.35); background: rgba(255,255,255,0.06); }
        .chat-win-input input::placeholder { color: #30363d; }
        .chat-win-input button {
            background: linear-gradient(135deg, #58a6ff, #a78bfa);
            border: none; border-radius: 10px; padding: 10px 18px;
            color: #fff; font-size: 13px; font-weight: 700; cursor: pointer;
            font-family: 'Inter', sans-serif; transition: all 0.2s; white-space: nowrap;
        }
        .chat-win-input button:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(88,166,255,0.3); }
        .chat-win-input button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

        .chat-header-actions { margin-left: auto; display: flex; gap: 6px; }
        .chat-header-btn {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px; padding: 5px 10px; cursor: pointer;
            font-size: 11px; font-weight: 600; color: #6e7681;
            font-family: 'Inter', sans-serif; transition: all 0.2s;
            display: flex; align-items: center; gap: 4px;
        }
        .chat-header-btn:hover { background: rgba(88,166,255,0.1); color: #c9d1d9; border-color: rgba(88,166,255,0.2); }

        @media (max-width: 500px) {
            .chat-window { right: 12px; left: 12px; bottom: 90px; width: auto; height: 70vh; }
            .chat-fab { bottom: 20px; right: 20px; width: 54px; height: 54px; font-size: 22px; }
        }
    </style>
</head>
<body>
    <nav class="nav">
        <a href="/" class="nav-logo">
            <span class="nav-logo-icon">⚡</span>
            <span class="nav-logo-text">SynapseOps</span>
        </a>
        <a href="/" class="nav-link {% block nav_dashboard %}{% endblock %}">Dashboard</a>
        <a href="/metrics" class="nav-link {% block nav_metrics %}{% endblock %}">Metrics</a>
        <a href="/pipelines" class="nav-link {% block nav_pipelines %}{% endblock %}">Pipelines</a>
        <a href="/activity" class="nav-link {% block nav_activity %}{% endblock %}">Activity</a>
        <a href="/test" class="nav-link {% block nav_test %}{% endblock %}">Test PR</a>
        <div class="nav-right">
            <div class="nav-status">
                <span class="nav-status-dot"></span>
                All Systems Online
            </div>
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <!-- Floating Chat Widget -->
    <button class="chat-fab" id="chatFab" onclick="toggleChat()" aria-label="Open chat assistant">💬</button>
    <div class="chat-window" id="chatWindow">
        <div class="chat-win-header">
            <div class="chat-win-header-icon">⚡</div>
            <div class="chat-win-header-text">
                <h3>SynapseOps AI</h3>
                <p>Ready to help</p>
            </div>
            <div class="chat-header-actions">
                <button class="chat-header-btn" id="chatResetBtn" onclick="chatReset()" title="New conversation">🔄 New</button>
            </div>
        </div>
        <div class="chat-win-body" id="chatBody">
            <div class="chat-welcome">
                <div class="chat-welcome-emoji">🤖</div>
                <h4>Hey there! How can I help?</h4>
                <p>Ask about your APIs, errors, deployments, SLA compliance, or anything else.</p>
            </div>
            <div class="chat-quick-btns">
                <button class="chat-quick-btn" onclick="chatSend('Show me top 10 APIs')">
                    <div class="qicon">📊</div><div class="qtitle">Top APIs</div><div class="qdesc">Most used endpoints</div>
                </button>
                <button class="chat-quick-btn" onclick="chatSend('Show me 500 errors from last hour')">
                    <div class="qicon">🚨</div><div class="qtitle">Error Analysis</div><div class="qdesc">Recent 500 errors</div>
                </button>
                <button class="chat-quick-btn" onclick="chatSend('What\\'s the slowest API?')">
                    <div class="qicon">🐢</div><div class="qtitle">Slowest APIs</div><div class="qdesc">High latency endpoints</div>
                </button>
                <button class="chat-quick-btn" onclick="chatSend('Any recent deployments causing issues?')">
                    <div class="qicon">🚀</div><div class="qtitle">Deployments</div><div class="qdesc">Deploy & error correlation</div>
                </button>
                <button class="chat-quick-btn" onclick="chatSend('Are there any recurring errors?')">
                    <div class="qicon">🔁</div><div class="qtitle">Recurring Errors</div><div class="qdesc">Persistent issues</div>
                </button>
                <button class="chat-quick-btn" onclick="chatSend('Check SLA for /api/products')">
                    <div class="qicon">📋</div><div class="qtitle">SLA Check</div><div class="qdesc">Compliance status</div>
                </button>
            </div>
        </div>
        <div class="chat-win-input">
            <input type="text" id="chatInput" placeholder="Ask anything..." onkeydown="if(event.key==='Enter')chatSend()">
            <button id="chatSendBtn" onclick="chatSend()">Send</button>
        </div>
    </div>

    <script>
    let chatOpen = false, chatLoading = false, chatHasMessages = false;

    const WELCOME_HTML = `<div class="chat-welcome">
                <div class="chat-welcome-emoji">🤖</div>
                <h4>Hey there! How can I help?</h4>
                <p>Ask about your APIs, errors, deployments, SLA compliance, or anything else.</p>
            </div>
            <div class="chat-quick-btns">
                <button class="chat-quick-btn" onclick="chatSend('Show me top 10 APIs')">
                    <div class="qicon">📊</div><div class="qtitle">Top APIs</div><div class="qdesc">Most used endpoints</div>
                </button>
                <button class="chat-quick-btn" onclick="chatSend('Show me 500 errors from last hour')">
                    <div class="qicon">🚨</div><div class="qtitle">Error Analysis</div><div class="qdesc">Recent 500 errors</div>
                </button>
                <button class="chat-quick-btn" onclick="chatSend('What\\'s the slowest API?')">
                    <div class="qicon">🐢</div><div class="qtitle">Slowest APIs</div><div class="qdesc">High latency endpoints</div>
                </button>
                <button class="chat-quick-btn" onclick="chatSend('Any recent deployments causing issues?')">
                    <div class="qicon">🚀</div><div class="qtitle">Deployments</div><div class="qdesc">Deploy & error correlation</div>
                </button>
                <button class="chat-quick-btn" onclick="chatSend('Are there any recurring errors?')">
                    <div class="qicon">🔁</div><div class="qtitle">Recurring Errors</div><div class="qdesc">Persistent issues</div>
                </button>
                <button class="chat-quick-btn" onclick="chatSend('Check SLA for /api/products')">
                    <div class="qicon">📋</div><div class="qtitle">SLA Check</div><div class="qdesc">Compliance status</div>
                </button>
            </div>`;

    function chatReset() {
        const body = document.getElementById('chatBody');
        body.innerHTML = WELCOME_HTML;
        chatHasMessages = false;
        document.getElementById('chatInput').value = '';
        document.getElementById('chatInput').focus();
    }

    function toggleChat() {
        chatOpen = !chatOpen;
        document.getElementById('chatFab').classList.toggle('open', chatOpen);
        document.getElementById('chatFab').innerHTML = chatOpen ? '✕' : '💬';
        document.getElementById('chatWindow').classList.toggle('open', chatOpen);
        if (chatOpen) setTimeout(() => document.getElementById('chatInput').focus(), 100);
    }

    function appendMsg(role, text, data) {
        const body = document.getElementById('chatBody');
        if (!chatHasMessages) {
            const w = body.querySelector('.chat-welcome');
            const q = body.querySelector('.chat-quick-btns');
            if (w) w.remove();
            if (q) q.remove();
            chatHasMessages = true;
        }
        const div = document.createElement('div');
        div.className = 'chat-msg ' + role;
        div.textContent = text;
        if (data && Object.keys(data).length > 0 && !data.error) {
            const box = document.createElement('div');
            box.className = 'chat-data';
            const pre = document.createElement('pre');
            pre.textContent = JSON.stringify(data, null, 2);
            box.appendChild(pre);
            div.appendChild(box);
        }
        body.appendChild(div);
        body.scrollTop = body.scrollHeight;
    }

    function showTyping() {
        const body = document.getElementById('chatBody');
        const div = document.createElement('div');
        div.className = 'chat-typing'; div.id = 'chatTyping';
        div.innerHTML = '<span></span><span></span><span></span>';
        body.appendChild(div);
        body.scrollTop = body.scrollHeight;
    }

    function hideTyping() { const el = document.getElementById('chatTyping'); if (el) el.remove(); }

    async function chatSend(text) {
        const input = document.getElementById('chatInput');
        const msg = text || input.value.trim();
        if (!msg || chatLoading) return;
        input.value = '';
        chatLoading = true;
        document.getElementById('chatSendBtn').disabled = true;
        appendMsg('user', msg);
        showTyping();
        try {
            const res = await fetch('/api/chat/', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: msg }),
            });
            const result = await res.json();
            hideTyping();
            appendMsg('bot', result.response || "Hmm, I couldn't process that.", result.data || null);
        } catch (err) {
            hideTyping();
            appendMsg('bot', '⚠️ Connection error. Is the backend running?');
        }
        chatLoading = false;
        document.getElementById('chatSendBtn').disabled = false;
        input.focus();
    }
    </script>
</body>
</html>
